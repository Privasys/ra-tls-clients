#
# Test every SDK against the shared RA-TLS v2 vectors on each push and pull
# request. The SDKs build on upstream TLS stacks; no fork toolchain is needed.

name: CI

on:
  push:
    branches: [main, ratls-v2]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
      - name: Test
        working-directory: go
        run: |
          go vet ./...
          go test ./... -count=1

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        working-directory: rust
        run: |
          cargo fmt --check
          cargo test

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Test
        working-directory: typescript
        run: |
          npm ci
          npm run typecheck
          npm test

  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - name: Build and test
        run: |
          dotnet build dotnet/RaTlsClient.csproj -nologo
          dotnet build dotnet/BouncyCastle/RaTlsClient.BouncyCastle.csproj -nologo
          dotnet test dotnet/tests/RaTlsClient.Tests -nologo

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Test
        run: |
          python -m pip install --quiet pytest cryptography pyopenssl
          python -m py_compile python/ratls_client.py
          # pyOpenSSL transport: challenge mode, re-attestation, the mutual leg.
          python -m pytest python/ -q
          # Standard-library transport only (pyOpenSSL hidden): deterministic mode.
          mkdir -p /tmp/no-pyopenssl && printf 'raise ImportError("hidden: standard-library transport run")\n' > /tmp/no-pyopenssl/OpenSSL.py
          PYTHONPATH=/tmp/no-pyopenssl python -m pytest python/ -q
